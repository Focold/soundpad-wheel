name: 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出想法。也请说明它解决什么问题——"想更顺手"也是有效的理由。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      placeholder: 现在要在 30 个音效里找一个太慢……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 轮盘交互
        - 设置界面
        - 与 Soundpad 的通信
        - 外观/主题
        - 构建/文档
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue / 讨论
          required: true
